services:
  db:
    image: postgres:16
    container_name: ogd-platform-db
    environment:
      POSTGRES_DB: ogd_platform
      POSTGRES_USER: ogd_platform
      POSTGRES_PASSWORD: ogd_platform
    ports:
      - "55432:5432"
    volumes:
      - ogd-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogd_platform -d ogd_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ogd-platform-postgres:
